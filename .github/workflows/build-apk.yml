name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev \
          build-essential ccache m4 \
          libltdl-dev

    - name: Set JAVA_HOME to Java 17
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH" >> $GITHUB_ENV

    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1 | tee build.log
        echo "Build completed with status: $?"
        echo "Last 50 lines of build log:"
        tail -n 50 build.log

    - name: Upload build log (always runs)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: buildozer-log
        path: build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: golden-oaks-golf-apk
        path: bin/*.apk