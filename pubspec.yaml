name: golden_oaks_golf
description: Golden Oaks Golf League - Flutter Proof of Concept
version: 3.8.26+4

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  csv: ^5.0.2
  firebase_core: ^3.15.2
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.2
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/GoldenOaks_square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/GoldenOaks_square.png"